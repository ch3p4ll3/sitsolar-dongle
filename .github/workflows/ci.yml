name: CI

# Runs the test suite and a distribution build on every push to main and on
# every pull request, so packaging or protocol regressions are caught before a
# release is cut -- the publish workflow is the last gate, not the first.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  package:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: twine check --strict dist/*

      - name: Check the wheel is importable and the CLI entry point resolves
        run: |
          pip install dist/*.whl
          python -c "import sitsolar_dongle; print('version:', sitsolar_dongle.__version__)"
          sitsolar-dongle --version
          sitsolar-dongle --list > /dev/null
