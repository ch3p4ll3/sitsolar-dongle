[project]
name = "sitsolar-dongle"
version = "0.1.0"
description = "Read-only Modbus polling client for the SiNeng / FuturaPulse WiFi dongle (TCP port 7078)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.19",
]

[project.scripts]
sitsolar-dongle = "sitsolar_dongle.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitsolar_dongle"]
